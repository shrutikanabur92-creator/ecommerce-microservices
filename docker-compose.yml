services:

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5001:5001"

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "5003:5003"

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5002:5002"
    depends_on:
      - product-service
      - payment-service
